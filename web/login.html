<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartLocker - Đăng Nhập Hệ Thống</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">PL</div>
        <h1>SmartLocker</h1>
        <p>Đăng nhập cho Khách hàng hoặc Quản trị viên trạm</p>
      </div>

      <div id="loginErrorBox" class="auth-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginPhone">Số Điện Thoại</label>
          <input
            type="tel"
            id="loginPhone"
            class="form-control"
            placeholder="Nhập số điện thoại (VD: 0912343456)"
            autocomplete="username"
            required
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">Mật Khẩu</label>
          <input
            type="password"
            id="loginPassword"
            class="form-control"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          id="loginSubmitBtn"
          class="action-pill-btn"
          style="width:100%; justify-content:center; padding:12px 20px; margin-top:4px;"
        >
          Đăng Nhập
        </button>
      </form>

      <div class="demo-accounts-box">
        <div class="demo-accounts-title">Tài Khoản Dùng Thử Nhanh</div>
        <div class="demo-btn-row">
          <button
            type="button"
            class="demo-fill-btn"
            data-demo-phone="0912343456"
            data-demo-pass="123456"
          >
            <span data-fa="user" style="display:inline; margin-right:6px;"></span>Khách Hàng
            <span>0912343456 / 123456</span>
          </button>

          <button
            type="button"
            class="demo-fill-btn"
            data-demo-phone="0900000000"
            data-demo-pass="admin123"
          >
            <span data-fa="user-shield" style="display:inline; margin-right:6px;"></span>Quản Trị Viên
            <span>0900000000 / admin123</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/core/icons.js"></script>
  <script src="/static/js/core/api.js"></script>
  <script src="/static/js/core/auth-session.js"></script>
  <script src="/static/js/auth-login.js"></script>
</body>
</html>
