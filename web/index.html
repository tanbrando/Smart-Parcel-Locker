<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartLocker - Tổng quan</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="app-container">
    <!-- Shared Sidebar Container -->
    <div id="sidebarContainer"></div>

    <!-- Main Workspace -->
    <main class="main-content">
      <div class="top-bar">
        <div class="page-title-block">
          <h1>Tổng quan</h1>
        </div>
        <div class="top-bar-actions">
          <button onclick="fetchAllData(); initDashboardPage();" class="icon-btn" title="Làm mới" aria-label="Làm mới">
            <span data-fa="rotate-right"></span>
          </button>
        </div>
      </div>

      <div class="metrics-strip">
        <div class="metric-card">
          <div class="metric-label">Tổng bưu kiện</div>
          <div class="metric-value-row"><span class="metric-value" id="kpiTotalOrders">0</span></div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Chờ giao</div>
          <div class="metric-value-row"><span class="metric-value" id="kpiPendingOrders">0</span></div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Trong tủ</div>
          <div class="metric-value-row"><span class="metric-value" id="kpiStoredOrders">0</span></div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Đã nhận</div>
          <div class="metric-value-row"><span class="metric-value" id="kpiCollectedOrders">0</span></div>
        </div>
        <div class="metric-card highlight">
          <div class="metric-label">Lấp đầy tủ</div>
          <div class="metric-value-row">
            <span class="metric-value" id="kpiOccupancyRate">0%</span>
            <span class="metric-sub" id="kpiEmptyCount" title="Ngăn trống"></span>
          </div>
        </div>
      </div>

      <div class="bento-card">
        <div class="bento-header">
          <div class="bento-title">Quy trình</div>
        </div>
        <div class="pipeline-grid">
          <div class="pipeline-stage">
            <span class="stage-badge yellow"><span data-fa="cloud-arrow-up"></span> Đăng ký</span>
            <div class="stage-track"><div class="stage-fill" id="funnelRegisteredFill" style="width:0%;"></div></div>
            <div class="stage-value" id="funnelRegisteredCount">0</div>
          </div>
          <div class="pipeline-stage">
            <span class="stage-badge"><span data-fa="camera"></span> Quét đơn</span>
            <div class="stage-track"><div class="stage-fill" style="width:100%;"></div></div>
            <div class="stage-value">100%</div>
          </div>
          <div class="pipeline-stage">
            <span class="stage-badge"><span data-fa="vault"></span> Trong tủ</span>
            <div class="stage-track"><div class="stage-fill" id="funnelStoredFill" style="width:0%;"></div></div>
            <div class="stage-value" id="funnelStoredCount">0</div>
          </div>
          <div class="pipeline-stage">
            <span class="stage-badge dark"><span data-fa="circle-check"></span> Đã nhận</span>
            <div class="stage-track"><div class="stage-fill" id="funnelCollectedFill" style="width:0%;"></div></div>
            <div class="stage-value" id="funnelCollectedCount">0</div>
          </div>
        </div>
      </div>

      <div class="bento-lower-grid">
        <div class="bento-card">
          <div class="bento-header">
            <div class="bento-title">Ngăn tủ</div>
            <a href="/lockers" class="icon-btn sm" title="Chi tiết" aria-label="Chi tiết ngăn tủ"><span data-fa="chevron-right"></span></a>
          </div>
          <div id="dashLockersList">Đang tải...</div>
        </div>
        <div class="bento-card">
          <div class="bento-header">
            <div class="bento-title">Bưu kiện gần đây</div>
            <a href="/orders" class="icon-btn sm" title="Tất cả" aria-label="Tất cả đơn hàng"><span data-fa="chevron-right"></span></a>
          </div>
          <div id="dashRecentOrdersList">Đang tải...</div>
        </div>
        <div class="bento-card">
          <div class="bento-header">
            <div class="bento-title">Nhật ký</div>
            <a href="/logs" class="icon-btn sm" title="Lịch sử" aria-label="Lịch sử nhật ký"><span data-fa="chevron-right"></span></a>
          </div>
          <div id="dashRecentLogsList">Đang tải...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/core/icons.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initDashboardPage();
    });
  </script>
</body>
</html>
