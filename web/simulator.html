<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartLocker - Giả lập</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebarContainer"></div>

    <main class="main-content">
      <div class="top-bar">
        <div class="page-title-block">
          <h1>Giả lập</h1>
        </div>
        <div class="top-bar-actions">
          <a href="/docs" target="_blank" rel="noopener" class="icon-btn" title="Swagger API" aria-label="Swagger API">
            <span data-fa="code"></span>
          </a>
        </div>
      </div>

      <div class="two-col-grid">
        <!-- Telegram Bot -->
        <div class="bento-card">
          <div class="bento-header">
            <div class="bento-title"><span data-fa="paper-plane"></span> Telegram Bot</div>
          </div>

          <div class="form-group">
            <label for="simTgChatId">Chat ID</label>
            <input type="number" id="simTgChatId" class="form-control" value="123456789">
          </div>

          <div class="form-group">
            <label for="simTgText">Lệnh / tin nhắn</label>
            <div class="input-row">
              <input type="text" id="simTgText" class="form-control" placeholder="/start 1, /orders, /help">
              <button onclick="sendTgSimText()" class="icon-btn dark" title="Gửi" aria-label="Gửi lệnh"><span data-fa="paper-plane"></span></button>
            </div>
          </div>

          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;">
            <button onclick="setTgCmd('/start')" class="action-pill-btn secondary sm">/start</button>
            <button onclick="setTgCmd('/orders')" class="action-pill-btn secondary sm">/orders</button>
            <button onclick="setTgCmd('/lockers')" class="action-pill-btn secondary sm">/lockers</button>
            <button onclick="setTgCmd('/profile')" class="action-pill-btn secondary sm">/profile</button>
            <button onclick="setTgCmd('/help')" class="action-pill-btn secondary sm">/help</button>
            <button onclick="setTgCmd('/unlink')" class="action-pill-btn secondary sm" style="color:var(--danger);">/unlink</button>
          </div>

          <div class="form-group">
            <label for="simTgFile"><span data-fa="image"></span> Ảnh đơn hàng (OCR)</label>
            <div class="input-row">
              <input type="file" id="simTgFile" accept="image/*" class="form-control" style="font-size:0.85rem; padding:8px 10px;">
              <button onclick="sendTgSimPhoto()" class="icon-btn" title="Gửi ảnh" aria-label="Gửi ảnh"><span data-fa="cloud-arrow-up"></span></button>
            </div>
          </div>

          <div id="simTgConsole" class="terminal-window" style="display:none;"></div>
        </div>

        <!-- Edge Hardware -->
        <div class="bento-card">
          <div class="bento-header">
            <div class="bento-title"><span data-fa="terminal"></span> Edge (Raspberry Pi)</div>
          </div>

          <div class="pipeline-stage" style="margin-bottom:12px;">
            <div class="sim-step-title"><span data-fa="camera"></span> 1. Quét đơn</div>
            <div class="input-row" style="margin-bottom:8px;">
              <input type="text" id="simTracking" class="form-control" placeholder="Mã vận đơn" value="SPXVN048291048" title="Mã vận đơn">
            </div>
            <button onclick="simEdgeVerify()" class="action-pill-btn secondary sm" title="POST /pi/verify-package"><span data-fa="play"></span> Quét</button>
          </div>

          <div class="pipeline-stage" style="margin-bottom:12px;">
            <div class="sim-step-title"><span data-fa="ruler"></span> 2. Đặt hàng &amp; đo HC-SR04</div>
            <div class="input-row" style="margin-bottom:8px;">
              <input type="number" id="simOrderId" class="form-control narrow" placeholder="Order" value="1" title="Order ID">
              <input type="number" id="simLockerNum" class="form-control narrow" placeholder="Tủ" value="1" title="Ngăn tủ số (1-4)">
              <input type="number" step="0.5" id="simDistanceCm" class="form-control" placeholder="Khoảng cách (cm)" value="14" title="Khoảng cách HC-SR04 (cm) — Tủ trống: 35 cm">
            </div>
            <button onclick="simEdgeDeposit()" class="action-pill-btn secondary sm" title="POST /pi/confirm-deposit"><span data-fa="play"></span> Đo &amp; Xác nhận</button>
          </div>

          <div class="pipeline-stage">
            <div class="sim-step-title"><span data-fa="vault"></span> 3. Nhập OTP</div>
            <div class="input-row">
              <input type="text" id="simOtpCode" class="form-control" placeholder="OTP 6 số">
              <button onclick="simEdgeOtp()" class="icon-btn dark" title="POST /pi/verify-otp" aria-label="Xác thực OTP"><span data-fa="check"></span></button>
            </div>
          </div>

          <div id="simEdgeConsole" class="terminal-window" style="display:none;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/core/icons.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initSimulatorPage();
    });
  </script>
</body>
</html>
