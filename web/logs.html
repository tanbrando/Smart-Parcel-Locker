<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartLocker - Nhật ký</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <div class="app-container">
    <div id="sidebarContainer"></div>

    <main class="main-content">
      <div class="top-bar">
        <div class="page-title-block">
          <h1>Nhật ký</h1>
        </div>
        <div class="top-bar-actions">
          <button onclick="initLogsPage()" class="icon-btn" title="Làm mới" aria-label="Làm mới">
            <span data-fa="rotate-right"></span>
          </button>
        </div>
      </div>

      <div class="bento-card">
        <div class="table-container">
          <table id="logsTable">
            <thead>
              <tr>
                <th>Thời gian</th>
                <th>Sự kiện</th>
                <th>Ngăn</th>
                <th>Đơn</th>
                <th>Chi tiết</th>
              </tr>
            </thead>
            <tbody>
              <tr><td colspan="5" style="text-align:center; padding:24px; color:var(--text-muted);">Đang tải...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/core/icons.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initLogsPage();
    });
  </script>
</body>
</html>
