<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SmartLocker - Cổng Người Dùng</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Left sidebar on desktop, fixed bottom menu on mobile -->
    <div id="sidebarContainer"></div>

    <main class="main-content">
      <!-- Compact Mobile Header -->
      <div class="mobile-top-header">
        <div class="mobile-top-user">
          <div class="brand-badge">PL</div>
          <div>
            <div style="font-weight:800; font-size:1.05rem;">SmartLocker</div>
            <div id="mobilePortalUserName" style="font-size:0.84rem; color:var(--text-muted);">Khách hàng</div>
          </div>
        </div>
        <button type="button" id="mobileLogoutBtn" class="icon-btn danger" title="Đăng xuất" aria-label="Đăng xuất">
          <span data-fa="right-from-bracket"></span>
        </button>
      </div>

      <!-- Top Bar -->
      <div class="top-bar">
        <div class="page-title-block">
          <h1>Xin chào, <span id="portalUserName">Khách hàng</span></h1>
        </div>
        <div class="top-bar-actions">
          <button type="button" id="portalRefreshBtn" class="icon-btn" title="Làm mới" aria-label="Làm mới">
            <span data-fa="rotate-right"></span>
          </button>
        </div>
      </div>

      <!-- TAB 1: ORDERS -->
      <section id="tab-orders" class="portal-tab-panel active">
        <div class="metrics-strip">
          <div class="metric-card">
            <div class="metric-label">Tổng đơn</div>
            <div class="metric-value-row"><span class="metric-value" id="userKpiTotal">0</span></div>
          </div>
          <div class="metric-card highlight">
            <div class="metric-label">Trong tủ</div>
            <div class="metric-value-row"><span class="metric-value" id="userKpiStored">0</span></div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Chờ giao</div>
            <div class="metric-value-row"><span class="metric-value" id="userKpiPending">0</span></div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Đã nhận</div>
            <div class="metric-value-row"><span class="metric-value" id="userKpiCollected">0</span></div>
          </div>
        </div>

        <div class="bento-card">
          <div class="bento-header" style="margin-bottom:14px;">
            <div class="bento-title">Đơn hàng</div>
          </div>

          <div id="portalOrdersFilters" class="filter-pills-row">
            <button type="button" class="filter-pill active" data-filter="ALL">Tất cả</button>
            <button type="button" class="filter-pill" data-filter="STORED">Trong tủ</button>
            <button type="button" class="filter-pill" data-filter="REGISTERED">Chờ giao</button>
            <button type="button" class="filter-pill" data-filter="COLLECTED">Đã nhận</button>
          </div>

          <div id="portalOrdersList" class="order-cards-grid">
            <div class="empty-state-box">Đang tải...</div>
          </div>
        </div>
      </section>

      <!-- TAB 2: UPLOAD ORDER SCREENSHOT -->
      <section id="tab-upload" class="portal-tab-panel">
        <div class="form-card">
          <div class="bento-title" style="margin-bottom:14px;">Gửi ảnh đơn hàng</div>

          <div id="orderUploadDropzone" class="upload-dropzone">
            <div style="font-size:2.4rem; margin-bottom:8px; color:var(--text-dark);" data-fa="cloud-arrow-up"></div>
            <div id="orderSelectedFileName" style="font-weight:700; font-size:1rem; color:var(--text-dark); overflow-wrap:anywhere;">
              Chọn hoặc chụp ảnh
            </div>
            <img id="orderPreviewImg" class="upload-preview-img" alt="Ảnh đơn hàng">
            <input type="file" id="orderImageInput" accept="image/*" style="display:none;">
          </div>

          <div class="form-group" style="margin-top:16px;">
            <label for="orderExpectedWeight"><span data-fa="weight-hanging"></span> Khối lượng (g)</label>
            <input type="number" id="orderExpectedWeight" class="form-control" placeholder="Không bắt buộc" min="50" max="5000">
          </div>

          <button type="button" id="orderUploadSubmitBtn" class="action-pill-btn block" style="padding:13px 22px;">
            <span data-fa="cloud-arrow-up"></span> Gửi ảnh
          </button>

          <div id="orderUploadResult" style="display:none; margin-top:14px;"></div>
        </div>
      </section>

      <!-- TAB 3: FACE ID -->
      <section id="tab-faceid" class="portal-tab-panel">
        <div class="bento-card">
          <div class="face-header">
            <div class="face-header-title">
              <span class="bento-title">Face ID</span>
              <span id="faceStatusBadge" class="pill-badge REGISTERED">Chưa đăng ký</span>
              <span id="facePickupAccountId"></span>
            </div>
            <label class="toggle-switch" title="Bật / tắt Face ID">
              <input type="checkbox" id="faceAuthToggleInput" aria-label="Bật / tắt Face ID">
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="face-studio">
            <div id="faceCameraStage" class="face-camera-stage">
              <video id="faceCameraVideo" autoplay playsinline muted></video>
              <svg id="faceHudSvg" class="face-hud-svg" viewBox="0 0 400 300" preserveAspectRatio="none"></svg>

              <div class="face-telemetry">
                <span id="telLight" class="tel-dot" title="Ánh sáng"><span data-fa="sun"></span></span>
                <span id="telFrame" class="tel-dot" title="Căn khung"><span data-fa="crosshairs"></span></span>
                <span id="telStable" class="tel-dot" title="Giữ yên"><span data-fa="hand"></span></span>
              </div>
              <div id="faceCountdownBadge" class="face-countdown-overlay">3</div>
              <div id="facePromptPill" class="face-prompt-pill"></div>

              <button type="button" id="faceStartCameraBtn" class="face-start-overlay" title="Bật camera" aria-label="Bật camera">
                <span data-fa="camera"></span>
              </button>
            </div>

            <div id="faceAngleStepsGrid" class="angle-steps-grid"></div>

            <div class="face-controls">
              <button type="button" id="faceResetAnglesBtn" class="icon-btn" title="Chụp lại từ đầu" aria-label="Chụp lại từ đầu">
                <span data-fa="rotate-left"></span>
              </button>
              <button type="button" id="faceCaptureAngleBtn" class="shutter-btn" title="Chụp góc này" aria-label="Chụp góc này">
                <span data-fa="camera"></span>
              </button>
              <button type="button" id="faceAutoCaptureBtn" class="icon-btn is-on" title="Tự động chụp: bật" aria-label="Tự động chụp" aria-pressed="true">
                <span data-fa="bolt"></span>
              </button>
            </div>

            <button type="button" id="faceSaveEnrollBtn" class="action-pill-btn block" style="padding:13px 22px;" hidden>
              <span data-fa="circle-check"></span> Lưu Face ID
            </button>
          </div>

          <!-- Native camera fallback (works on iOS/Android without HTTPS) -->
          <input type="file" id="faceNativeCaptureInput" accept="image/*" capture="user" hidden>
          <canvas id="faceCaptureCanvas" hidden></canvas>
          <canvas id="faceAnalysisCanvas" hidden></canvas>
        </div>
      </section>

      <!-- TAB 4: NOTIFICATIONS & OTP -->
      <section id="tab-notifications" class="portal-tab-panel">
        <div class="bento-card">
          <div class="bento-header" style="margin-bottom:14px;">
            <div class="bento-title">Thông báo &amp; OTP</div>
          </div>
          <div id="portalNotificationsList" style="display:flex; flex-direction:column; gap:12px;">
            <div class="empty-state-box">Đang tải...</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/core/icons.js"></script>
  <script src="/static/js/core/api.js"></script>
  <script src="/static/js/core/auth-session.js"></script>
  <script src="/static/js/portal/orders-tab.js"></script>
  <script src="/static/js/portal/upload-tab.js"></script>
  <script src="/static/js/portal/face-id-tab.js"></script>
  <script src="/static/js/portal/notifications-tab.js"></script>
  <script src="/static/js/portal/portal-main.js"></script>
</body>
</html>
